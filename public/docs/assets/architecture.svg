<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" rx="12" fill="#0B0F19"/>
  
  <!-- Studio Box -->
  <rect x="250" y="50" width="300" height="400" rx="8" fill="#161B22" stroke="#30363D" stroke-width="2"/>
  <text x="400" y="85" font-family="JetBrains Mono, monospace" font-size="20" fill="#58A6FF" text-anchor="middle" font-weight="bold">Agent Harness Studio</text>
  
  <!-- Components -->
  <rect x="280" y="120" width="240" height="60" rx="4" fill="#21262D" stroke="#30363D"/>
  <text x="400" y="155" font-family="Inter, sans-serif" font-size="14" fill="#C9D1D9" text-anchor="middle">Frontend (React/Vite)</text>
  
  <rect x="280" y="200" width="240" height="60" rx="4" fill="#21262D" stroke="#30363D"/>
  <text x="400" y="235" font-family="Inter, sans-serif" font-size="14" fill="#C9D1D9" text-anchor="middle">Backend (FastAPI)</text>
  
  <rect x="280" y="280" width="240" height="80" rx="4" fill="#1F6FEB" fill-opacity="0.1" stroke="#1F6FEB"/>
  <text x="400" y="315" font-family="Inter, sans-serif" font-size="14" fill="#58A6FF" text-anchor="middle" font-weight="bold">Scanner Engine</text>
  <text x="400" y="335" font-family="Inter, sans-serif" font-size="11" fill="#8B949E" text-anchor="middle">(Hermes / Context / Memory)</text>

  <!-- External Systems -->
  <rect x="50" y="200" width="150" height="60" rx="4" fill="#238636" fill-opacity="0.1" stroke="#238636"/>
  <text x="125" y="235" font-family="Inter, sans-serif" font-size="14" fill="#3FB950" text-anchor="middle">User (~/.hermes)</text>
  
  <rect x="600" y="200" width="150" height="60" rx="4" fill="#D29922" fill-opacity="0.1" stroke="#D29922"/>
  <text x="675" y="235" font-family="Inter, sans-serif" font-size="14" fill="#D29922" text-anchor="middle">LLM proxy</text>

  <!-- Arrows -->
  <path d="M200 230H250" stroke="#30363D" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M550 230H600" stroke="#30363D" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M400 260V280" stroke="#30363D" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M400 180V200" stroke="#30363D" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Definitions -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#30363D" />
    </marker>
  </defs>
</svg>
